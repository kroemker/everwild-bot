name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Combat simulation (smoke run)
        run: python sim/combat_sim.py --fights 50 --sizes 1 4 --levels 1 5
      - name: Local play mode (scripted, offline)
        run: PYTHONPATH=src python -m everwild play --offline --neu --dir /tmp/spiel --script examples/testrunde.txt
